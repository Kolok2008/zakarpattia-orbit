<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Zakarpattia Orbit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --spruce:#0E2620; --moss:#2F4A3A; --lichen:#D8DEC8; --lichen-dim:#9FAA94;
  --ember:#E4572E; --amber:#E9A23B; --fresh:#7FB069;
  --line:rgba(216,222,200,.14); --accent:var(--fresh);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--spruce);color:var(--lichen);font:15px/1.5 Manrope,system-ui,sans-serif}
#map{position:fixed;inset:0;background:var(--moss)}
.leaflet-container{font:inherit;background:var(--moss)}
.leaflet-tile-container img{outline:1px solid transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lichen);outline-offset:2px}

/* ---------- panel ---------- */
.panel{position:fixed;top:20px;left:20px;bottom:20px;width:420px;z-index:600;display:flex;flex-direction:column;gap:22px;
  padding:22px 26px 22px;overflow-y:auto;overscroll-behavior:contain;background:rgba(14,38,32,.93);backdrop-filter:blur(8px);
  border-left:4px solid var(--accent);border-radius:4px 14px 14px 4px;transition:border-color .6s}
.panel>*{flex-shrink:0}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand b{font:700 15px/1 Unbounded,sans-serif}
.brand-r{display:flex;align-items:center;gap:12px}
.brand time{color:var(--lichen-dim);font-size:13px;font-variant-numeric:tabular-nums}
.lang{display:inline-flex;border:1px solid rgba(216,222,200,.3);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--lichen-dim)}
.lang button[aria-pressed="true"]{background:var(--lichen);color:var(--spruce);font-weight:700}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-top:-6px;border-radius:12px;background:rgba(216,222,200,.07)}
.tabs button{border:0;background:none;border-radius:9px;padding:8px 6px;font:500 13px/1.2 Unbounded,sans-serif;cursor:pointer;color:var(--lichen-dim)}
.tabs button[aria-selected="true"]{background:var(--spruce);color:var(--lichen);box-shadow:inset 0 0 0 1px var(--line)}
.view{display:flex;flex-direction:column;gap:22px}
.view>*{flex-shrink:0}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:-8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;background:rgba(216,222,200,.08);font-size:12.5px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--lichen-dim)}
.chip i.on{background:var(--fresh);box-shadow:0 0 0 3px rgba(127,176,105,.25)}
.chip i.sim{background:var(--amber)}
.season{display:flex;gap:10px;align-items:flex-start;margin-top:-10px;font-size:13px;color:var(--lichen-dim)}
.season b{flex-shrink:0;padding:2px 9px;border-radius:999px;font-size:12px;color:var(--spruce);background:var(--fresh)}
.season b.medium{background:var(--amber)}
.season b.high{background:var(--ember)}

h1.title{margin:0;font:700 clamp(28px,2.7vw,36px)/1.06 Unbounded,sans-serif;color:var(--accent);overflow-wrap:anywhere;transition:color .6s}
.lead{margin:10px 0 0;color:var(--lichen-dim)}

/* phases */
.phases{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px}
.phases span{height:5px;border-radius:3px;background:rgba(216,222,200,.15)}
.phases span.done{background:var(--lichen-dim)}
.phases span.now{background:var(--accent)}
.phase-label{display:flex;justify-content:space-between;margin-top:7px;font-size:13px;color:var(--lichen-dim)}
.phase-label b{color:var(--lichen);font-weight:700}

/* telemetry */
.tele{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden}
.tele div{background:var(--spruce);padding:10px 12px;min-width:0}
.tele span{display:block;font-size:12px;color:var(--lichen-dim);white-space:nowrap}
.tele b{display:block;font:500 18px/1.35 Unbounded,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.tele small{font:400 12px Manrope,sans-serif;color:var(--lichen-dim);margin-left:2px}
.tele b.low{color:var(--amber)}

/* sections */
h2.sec{margin:0 0 10px;font:500 15px/1.3 Unbounded,sans-serif}
h2.sec small{display:block;margin-top:3px;font:400 13px Manrope,sans-serif;color:var(--lichen-dim)}
.sensors h2.sec small{display:inline;margin:0 0 0 6px}
.sense{display:grid;grid-template-columns:1fr 96px;align-items:center;gap:4px 14px;padding:9px 0;border-top:1px solid var(--line)}
.sense:last-of-type{border-bottom:1px solid var(--line)}
.sense span{font-size:13px;color:var(--lichen-dim)}
.sense b{display:block;font:500 19px/1.3 Unbounded,sans-serif;font-variant-numeric:tabular-nums}
.sense b.ember{color:var(--ember)}
.sense svg{width:96px;height:30px;overflow:visible}
.sense path{fill:none;stroke:var(--lichen-dim);stroke-width:1.5;stroke-linejoin:round}
.sense path.ember{stroke:var(--ember)}
.note{margin:10px 0 0;font-size:13px;color:var(--amber)}
/* drone camera (v3: operator decides) */
.cam-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.cam-head h2{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 11px;font-size:12.5px;color:var(--lichen-dim)}
.seg button[aria-pressed="true"]{background:var(--lichen);color:var(--spruce);font-weight:700}
.seg button:focus-visible{outline:2px solid var(--lichen);outline-offset:-2px}
.cam{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0b1a16;border:1px solid var(--line)}
.cam #camMap{position:absolute;inset:0;background:#0b1a16}
.cam.thermal #camMap{filter:grayscale(1) contrast(1.5) brightness(.55)}
.cam .hot{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,#fff 0 8%,#ffe066 18%,#ff8c2a 34%,rgba(228,87,46,.55) 52%,rgba(228,87,46,0) 70%);mix-blend-mode:screen}
.cam:not(.thermal) .hot{background:radial-gradient(circle,rgba(255,170,90,.55) 0 10%,rgba(160,160,160,.35) 30%,rgba(200,200,200,0) 70%);mix-blend-mode:normal}
.cam .hud{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;font:500 11.5px/1.3 Manrope,sans-serif;color:#fff;text-shadow:0 1px 2px #000}
.cam .rec{display:inline-flex;align-items:center;gap:6px}
.cam .rec i{width:8px;height:8px;border-radius:50%;background:#E4572E}
.cam .cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:1.5px solid rgba(255,255,255,.7);border-radius:50%;pointer-events:none}
.cam .off[hidden]{display:none}
.cam .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:13px;color:var(--lichen-dim);background:rgba(11,26,22,.82)}
.hint{margin:10px 0 0;font-size:13.5px;color:var(--lichen-dim)}
.hint b{font-weight:700}
.decide{margin-top:12px;padding:14px;border-radius:10px;border:1px solid var(--accent);background:rgba(216,222,200,.05)}
.decide h3{margin:0 0 4px;font:700 17px/1.25 Unbounded,sans-serif}
.decide p{margin:0 0 10px;font-size:13px;color:var(--lichen-dim)}
.decide .row{display:flex;flex-wrap:wrap;gap:8px}
.btn.v-fire{background:#E4572E;border-color:#E4572E;color:#fff;font-weight:700}
.btn.v-field{background:#E9A23B;border-color:#E9A23B;color:var(--spruce);font-weight:700}
.btn.v-false{border-color:#7FB069;color:#A9D08E}
.badge.ind{border-color:rgba(159,170,148,.6);color:var(--lichen)}
.spot.ind{background:#9FAA94;opacity:.75}
.legend i.i{background:#9FAA94}

/* verdict */
.verdict{border-radius:10px;padding:18px 18px 16px;background:rgba(216,222,200,.06);border:1px solid var(--line)}
.verdict h3{margin:0;font:700 26px/1.1 Unbounded,sans-serif}
.verdict p{margin:8px 0 0;color:var(--lichen-dim)}
.meter{margin-top:14px;height:6px;border-radius:3px;background:rgba(216,222,200,.15)}
.meter i{display:block;height:100%;border-radius:3px}
.meter-label{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--lichen-dim)}
.meter-label b{color:var(--lichen)}
.verdict ul{margin:12px 0 0;padding-left:18px;color:var(--lichen-dim);font-size:13.5px}
.verdict li{margin-bottom:3px}
.verdict.reveal{animation:reveal .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes reveal{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* places */
.places-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.places-head h2{margin:0}
.places-head.wrap{flex-wrap:wrap;align-items:flex-end}
.places-head.wrap h2{flex:1 1 200px}
.btn{border:1px solid rgba(216,222,200,.35);background:transparent;border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(216,222,200,.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--lichen);color:var(--spruce);border-color:var(--lichen);font-weight:700}
.btn.primary:hover:not(:disabled){background:#fff}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.place{display:grid;grid-template-columns:12px 1fr auto;gap:2px 12px;align-items:start;padding:12px 2px;border-bottom:1px solid var(--line)}
.place .dot{width:10px;height:10px;margin-top:6px;border-radius:50%;background:#F2C1AE}
.place .dot.c{background:var(--ember)}
.place .go{all:unset;cursor:pointer;min-width:0;border-radius:4px}
.place .go:focus-visible{outline:2px solid var(--lichen);outline-offset:3px}
.place .s{display:block;font-size:14px;font-weight:700}
.place .m{display:block;font-size:12.5px;color:var(--lichen-dim)}
.place .v{display:block;font-size:12.5px;font-weight:700;margin-top:2px}
.place .t{font-size:12.5px;color:var(--lichen-dim);text-align:right;white-space:nowrap}
.place .act{grid-column:2/4;margin-top:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.place .act small{font-size:12px;color:var(--amber)}
.place.active{background:rgba(216,222,200,.05)}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.badge{font-size:11.5px;line-height:1.3;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--lichen-dim)}
.badge.often{border-color:rgba(233,162,59,.5);color:var(--amber)}
.badge.first{border-color:rgba(228,87,46,.55);color:#F08C6C}
.badge.high{background:var(--ember);border-color:var(--ember);color:var(--spruce);font-weight:700}
.badge.low{opacity:.75}
.empty{color:var(--lichen-dim);font-size:14px;margin:0;padding:12px 0}
.msg{font-size:13px;margin:8px 0 0;color:var(--lichen-dim)}
.msg.err{color:var(--amber)}

/* log */
.log li{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.log time{color:var(--lichen-dim);font-variant-numeric:tabular-nums}
.log b{font-weight:700}
.log .m{grid-column:2/4;color:var(--lichen-dim);font-size:12.5px}
.log .c{color:var(--lichen-dim);font-variant-numeric:tabular-nums}

/* calendar */
.cal-intro{margin:-8px 0 0;color:var(--lichen-dim);font-size:14px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:Manrope,sans-serif;fill:var(--lichen-dim);font-size:10px}
.chart .ax{stroke:rgba(216,222,200,.28);stroke-width:1}
.chart .grid{stroke:rgba(216,222,200,.08);stroke-width:1}
.seg{display:inline-flex;border:1px solid rgba(216,222,200,.3);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--lichen-dim)}
.seg button[aria-pressed="true"]{background:var(--lichen);color:var(--spruce);font-weight:700}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--lichen-dim)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-block;width:16px;height:0;border-top:2px solid}
.key i.band{height:9px;border:0;background:rgba(127,176,105,.28);border-radius:2px}
.key i.dot{width:8px;height:8px;border:0;border-radius:50%;background:var(--ember)}
.key i.bar{width:10px;height:10px;border:0;background:rgba(216,222,200,.35);border-radius:2px}
.key i.win{width:12px;height:10px;border:0;background:rgba(233,162,59,.25);border-radius:2px}
.cap{margin:8px 0 0;font-size:12.5px;color:var(--lichen-dim)}
.ramp{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--lichen-dim)}
.ramp i{flex:1;height:8px;border-radius:4px;max-width:180px}
.check{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden}
.check div{background:var(--spruce);padding:11px 13px}
.check span{display:block;font-size:12px;color:var(--lichen-dim)}
.check b{display:block;font:500 19px/1.3 Unbounded,sans-serif;font-variant-numeric:tabular-nums}
.check p{grid-column:1/3;margin:0;background:var(--spruce);padding:11px 13px;font-size:13px;color:var(--lichen-dim)}
.insights{margin:0;padding-left:18px;font-size:14px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.months button{all:unset;cursor:pointer;text-align:center;font-size:11.5px;padding:4px 0;border-radius:5px;color:var(--lichen-dim);background:rgba(216,222,200,.06)}
.months button[aria-pressed="true"]{background:var(--amber);color:var(--spruce);font-weight:700}
.months button:focus-visible{outline:2px solid var(--lichen)}
.legend i.rk{background:linear-gradient(90deg,#F2D06B,#E4572E)}
.legend i.un{background:linear-gradient(90deg,#9DB7E8,#5A3FA0)}
.newbase{width:16px;height:16px;border:2px dashed #fff;border-radius:3px;transform:rotate(45deg);background:rgba(127,176,105,.35)}
.legend i.nb{border-radius:2px;border:1.5px dashed #fff;background:rgba(127,176,105,.4);transform:rotate(45deg)}
.insights li{margin-bottom:7px}
.insights li::marker{color:var(--amber)}
.cal-empty{border:1px dashed rgba(216,222,200,.3);border-radius:10px;padding:16px;color:var(--lichen-dim);font-size:14px}
.cal-empty code{color:var(--lichen);font-size:13px}

/* map marks */
.base{width:20px;height:20px;border-radius:4px;background:var(--lichen);border:3px solid var(--spruce);transform:rotate(45deg);transition:background .3s}
.base.busy{background:var(--fresh);box-shadow:0 0 0 4px rgba(127,176,105,.35)}
.spot{width:14px;height:14px;border-radius:50%;background:#F2C1AE;border:2px solid #fff}
.spot.c{width:18px;height:18px;background:var(--ember)}
.spot.out{opacity:.6}
.spot.target{animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(228,87,46,.7)}100%{box-shadow:0 0 0 24px rgba(228,87,46,0)}}
.station{width:22px;height:22px;border-radius:5px;background:var(--ember);border:2px solid #fff;display:grid;place-items:center;
  font:700 11px/1 Unbounded,sans-serif;color:#fff}
.drone{width:44px;height:44px;display:grid;place-items:center;will-change:transform}
.drone svg{width:44px;height:44px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.tag{background:var(--spruce);color:var(--lichen);border:none;border-radius:6px;font:500 12.5px/1.3 Manrope,sans-serif;padding:5px 8px;box-shadow:none}
.tag::before{display:none}
.tag.base-tag{background:rgba(14,38,32,.85);font-size:12px;padding:3px 7px}
.far .tag.base-tag{display:none}
.far .tag.base-tag.keep{display:block}
.mode-cal .tag.base-tag{display:none}

/* alarm */
.alarm{position:fixed;top:20px;left:460px;right:72px;z-index:650;max-width:720px;border-radius:14px;padding:18px 20px 16px;
  background:var(--alarm,#E4572E);color:var(--spruce);box-shadow:0 12px 40px rgba(0,0,0,.45);
  display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:start}
.alarm.enter{animation:drop .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.alarm small{display:block;font-size:13px;font-weight:700;opacity:.8}
.alarm h2{margin:2px 0 0;font:700 clamp(22px,2.4vw,30px)/1.1 Unbounded,sans-serif}
.alarm .info{grid-column:1/2;margin:6px 0 0;font-size:14px;line-height:1.55}
.alarm .info b{font-variant-numeric:tabular-nums}
.alarm .acts{grid-column:2/3;grid-row:1/3;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.alarm .btn{border-color:rgba(14,38,32,.55);color:var(--spruce);background:rgba(255,255,255,.18);font-weight:700}
.alarm .btn:hover:not(:disabled){background:rgba(255,255,255,.32)}
.alarm .btn.solid{background:var(--spruce);color:var(--lichen);border-color:var(--spruce)}
.alarm .btn.solid:hover:not(:disabled){background:#163a31}
.alarm :focus-visible{outline-color:var(--spruce)}
.alarm .sent{grid-column:1/3;font-size:12.5px;font-weight:700;min-height:0;margin:0}

/* overlays */
.legend{position:fixed;right:20px;bottom:28px;z-index:600;display:flex;gap:16px;padding:9px 15px;border-radius:999px;background:rgba(14,38,32,.9);font-size:12.5px}
.legend span{display:flex;align-items:center;gap:7px;white-space:nowrap}
.legend i{width:11px;height:11px;border-radius:50%;background:#F2C1AE}
.legend i.c{background:var(--ember)}
.legend i.b{border-radius:3px;background:var(--lichen);transform:rotate(45deg)}
.legend i.d{width:0;height:0;border-radius:0;background:none;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid #fff}
.legend i.r{width:18px;height:0;border-radius:0;background:none;border-top:4px solid var(--ember)}
.legend i.ind{background:#9FAA94}
.legend i.h{background:rgba(233,162,59,.55);border:1.5px solid var(--amber)}
.follow{position:fixed;right:20px;top:96px;z-index:600}
.follow .btn{background:rgba(14,38,32,.92);border-color:rgba(216,222,200,.5)}
.offline{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:700;max-width:min(560px,calc(100vw - 32px));
  padding:9px 16px;border-radius:10px;background:rgba(14,38,32,.95);border:1px solid var(--amber);color:var(--lichen);font-size:13.5px}
[hidden]{display:none!important}

@media (max-width:1100px){ .alarm{left:460px;right:20px} }
@media (max-width:760px){
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:56vh;border-left:0;border-top:4px solid var(--accent);
    border-radius:14px 14px 0 0;padding:18px 18px 18px;gap:18px}
  .view{gap:18px}
  .legend{display:none}
  .follow{top:auto;bottom:calc(56vh + 12px);right:12px}
  .tele b{font-size:16px}
  .brand time{display:none}
  .alarm{top:10px;left:10px;right:10px;padding:14px 14px 12px;grid-template-columns:1fr;gap:4px}
  .alarm .acts{grid-column:1;grid-row:auto;flex-direction:row;flex-wrap:wrap;margin-top:8px}
  .alarm .info{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  .spot.target,.verdict.reveal,.alarm.enter{animation:none}
  .panel,.title{transition:none}
}
</style>
</head>
<body>
<div id="map" role="application"></div>

<div class="offline" id="offline" role="status" hidden></div>
<div class="follow" id="follow" hidden><button class="btn" type="button" id="followBtn" data-i18n="follow"></button></div>

<section class="alarm" id="alarm" role="alertdialog" aria-labelledby="aTitle" hidden>
  <div>
    <small id="aKicker"></small>
    <h2 id="aTitle"></h2>
  </div>
  <p class="info" id="aInfo"></p>
  <div class="acts">
    <button class="btn solid" type="button" id="aCopy" data-i18n="copyDsns"></button>
    <button class="btn" type="button" id="aAck" data-i18n="ack"></button>
    <button class="btn" type="button" id="aSound" hidden data-i18n="soundOn"></button>
  </div>
  <p class="sent" id="aSent" role="status"></p>
</section>

<aside class="panel" id="panel">
  <div class="brand">
    <b>Zakarpattia Orbit</b>
    <div class="brand-r">
      <div class="lang" role="group" aria-label="Мова / Language">

const fmt = (v, d=0) => (v === null || v === undefined || Number.isNaN(v)) ? '—'

const mmss = s => { if (s == null || s < 0) return '—'; s = Math.round(s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function spark(el, arr, hot) {
  const a = (arr || []).filter(v => v != null).slice(-90);
  if (a.length < 2) { el.setAttribute('d', ''); return; }
  const lo = Math.min(...a), hi = Math.max(...a), span = (hi - lo) || 1;
  el.setAttribute('d', a.map((v, i) => `${i ? 'L' : 'M'}${(i / (a.length - 1) * 96).toFixed(1)} ${(28 - (v - lo) / span * 26).toFixed(1)}`).join(''));
  el.classList.toggle('ember', !!hot);
}

function panTo(ll) {

function renderMap() {
  const busyBase = S.mission && S.mission.phase !== 'done' ? S.mission.base_id : null;
  S.bases.forEach(b => {
    if (!layers.bases[b.id]) {
      layers.rings[b.id] = L.circle([b.lat, b.lon], {radius:S.range_km * 1000, color:'#D8DEC8', weight:1, opacity:.22,
        dashArray:'3 7', fill:false, interactive:false}).addTo(map);
      layers.bases[b.id] = L.marker([b.lat, b.lon], {icon:divIcon('<div class="base"></div>', 22), keyboard:false})
        .addTo(map).bindTooltip(bn(b.name), {className:'tag base-tag', permanent:true, direction:'right', offset:[12,0]});
    }
    const mk = layers.bases[b.id];
    if (mk._lang !== LANG) { mk.setTooltipContent(bn(b.name)); mk._lang = LANG; }
    const el = mk.getElement(), busy = b.status === 'busy' || b.id === busyBase;
    if (el) el.firstChild.classList.toggle('busy', busy);
    const tt = mk.getTooltip() && mk.getTooltip().getElement();
    if (tt) tt.classList.toggle('keep', busy);
  });

  const seen = new Set();
  S.places.forEach(p => {
    seen.add(p.id);
    const active = S.mission && S.mission.place_id === p.id && S.mission.phase !== 'done';
    const color = p.verdict ? p.verdict.color : null;
    const cls = 'spot' + (p.confirmed ? ' c' : '') + (p.status === 'out_of_range' ? ' out' : '') + (p.status === 'industrial' ? ' ind' : '') + (active ? ' target' : '');
    const html = `<div class="${cls}"${color ? ` style="background:${color}"` : ''}></div>`;
    const h = p.history;
    const tip = `${esc(p.sensors.join(', '))}<br>${esc(p.latest)}, ${fmt(p.frp_max,1)} ${t('mw')}`
      + (h ? `<br>${esc(t('hist')[h.recurrence] || '')}` : '') + (p.static_source ? `<br>${esc(t('industrial'))}` : '') + (p.verdict ? `<br><b>${esc(vt(p.verdict))}</b>` : '');
    if (!layers.places[p.id]) {
      layers.places[p.id] = L.marker([p.lat, p.lon], {icon:divIcon(html, 22), title:t('hotspot'), zIndexOffset:500})
        .addTo(map).bindTooltip(tip, {className:'tag', direction:'top', offset:[0,-10]});
      layers.places[p.id]._html = html;
    } else {
      if (layers.places[p.id]._html !== html) { layers.places[p.id].setIcon(divIcon(html, 22)); layers.places[p.id]._html = html; }
      layers.places[p.id].setTooltipContent(tip);
    }
    const base = S.bases.find(b => b.id === p.base_id);
    if (base) {
      const ll = [[base.lat, base.lon], [p.lat, p.lon]];
      if (!layers.links[p.id]) layers.links[p.id] = L.polyline(ll, {color:'#D8DEC8', weight:1, opacity:.45, interactive:false}).addTo(map);
      else layers.links[p.id].setLatLngs(ll);
    } else if (layers.links[p.id]) { map.removeLayer(layers.links[p.id]); delete layers.links[p.id]; }
  });
  Object.keys(layers.places).forEach(id => { if (!seen.has(id)) {
    map.removeLayer(layers.places[id]); delete layers.places[id];
    if (layers.links[id]) { map.removeLayer(layers.links[id]); delete layers.links[id]; } } });

  // fire crew route
  const a = S.alarm, r = a && a.route;
  if (r && r.coords && r.coords.length > 1) {
    if (!fireRoute) fireRoute = L.polyline(r.coords, {color:'#E4572E', weight:6, opacity:.95, lineCap:'round', interactive:false}).addTo(map);
    else fireRoute.setLatLngs(r.coords);
    const st = r.coords[0];
    const label = t('stationTag', bn(r.from_name));
    if (!fireStation) fireStation = L.marker(st, {icon:divIcon('<div class="station">П</div>', 24), zIndexOffset:1500, keyboard:false})
      .addTo(map).bindTooltip(label, {className:'tag', permanent:true, direction:'left', offset:[-14,0]});
    else { fireStation.setLatLng(st); fireStation.setTooltipContent(label); }
  } else {
    [fireRoute, fireStation].forEach(l => l && map.removeLayer(l)); fireRoute = fireStation = null;
  }

  const m = S.mission;
  if (m) {
    if (!routeLine) routeLine = L.polyline(m.route, {color:'#fff', weight:2, opacity:.75, dashArray:'6 8', interactive:false}).addTo(map);
    else routeLine.setLatLngs(m.route);
    if (!trackLine) trackLine = L.polyline(m.track || [], {color:'#E4572E', weight:3, opacity:.95, interactive:false}).addTo(map);
    else trackLine.setLatLngs(m.track || []);
    const now = performance.now(), to = L.latLng(m.lat, m.lon);
    if (!droneMarker) {
      droneMarker = L.marker(to, {icon:L.divIcon({className:'', html:`<div class="drone">${DRONE_SVG}</div>`, iconSize:[44,44], iconAnchor:[22,22]}),
        zIndexOffset:2000, keyboard:false, title:t('droneT')}).addTo(map);
      interp.from = to; interp.headingFrom = m.heading_deg || 0;
    } else {
      interp.from = droneMarker.getLatLng(); interp.headingFrom = interp.headingCur ?? interp.headingTo;
    }
    interp.to = to; interp.headingTo = m.heading_deg || 0; interp.t0 = now;
    const mk = m.place_id + '|' + m.base_id;
    if (mk !== lastMissionKey) {
      lastMissionKey = mk; follow = true; $('follow').hidden = true;
      if (MODE === 'station') {
        autoMove = true;
        map.fitBounds(L.latLngBounds(m.route).pad(.35), {paddingTopLeft:[isWide() ? 460 : 16, 40],
          paddingBottomRight:[40, isWide() ? 40 : innerHeight * .56 + 16], maxZoom:13, animate:!reduceMotion});
        setTimeout(() => autoMove = false, 900);
      }
    } else if (MODE === 'station' && follow && m.phase !== 'done') panTo(to);
  } else {
    [droneMarker, trackLine, routeLine].forEach(l => l && map.removeLayer(l));
    droneMarker = trackLine = routeLine = null; interp.to = null; lastMissionKey = '';
  }
}

function tick(now) {
  if (droneMarker && interp.to) {
    const k = reduceMotion ? 1 : Math.min(1, (now - interp.t0) / interp.dur);
    const lat = interp.from.lat + (interp.to.lat - interp.from.lat) * k;
    const lng = interp.from.lng + (interp.to.lng - interp.from.lng) * k;
    droneMarker.setLatLng([lat, lng]);
    const dh = ((interp.headingTo - interp.headingFrom + 540) % 360) - 180;
    interp.headingCur = interp.headingFrom + dh * k;
    const el = droneMarker.getElement();
    if (el && el.firstChild) el.firstChild.style.transform = `rotate(${interp.headingCur}deg)`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

let audio = null, alarmKey = '', ackedLocal = '', beepTimer = 0, fittedAlarm = '';

    g.gain.exponentialRampToValueAtTime(0.0001, now + d + .18);

  });
}

  CAL.monthly.forEach(m => {
    const y = +m.ym.slice(0, 4);
    const o = by[y] || (by[y] = {y, n:0, modis:0, viirs:0, vN:0, h:0, lo:0, hi:0});
    o.n++; o.modis += m.modis || 0; o.h += m.harmonized || 0; o.lo += m.harmonized_lo ?? m.harmonized ?? 0; o.hi += m.harmonized_hi ?? m.harmonized ?? 0;
    if (m.viirs != null) { o.viirs += m.viirs; o.vN++; }

  return Object.values(by).sort((a, b) => a.y - b.y).map(o => ({...o, viirs: o.vN ? o.viirs : null, partial: o.n < 12}));
}
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function niceAxis(maxV, n = 4) { const step = niceMax(Math.max(maxV, 1e-9) / n); return {step, top: step * Math.ceil(maxV / step)}; }
const kfmt = v => v >= 10000 ? fmt(v / 1000, 0) + 'k' : v >= 1000 ? fmt(v / 1000, 1) + 'k' : fmt(v);

function chartYears() {
  const Y = yearly(); if (!Y.length) return;
  const W = 360, H = 210, L0 = 38, R0 = 10, T0 = 14, B0 = 24, iw = W - L0 - R0, ih = H - T0 - B0;
  const y0 = Y[0].y, y1 = Y[Y.length - 1].y;
  const raw = rawMode === 'raw';
  const vals = raw ? Y.flatMap(o => [o.modis, o.viirs || 0]) : Y.flatMap(o => [o.hi, o.h]);
  const ax = niceAxis(Math.max(...vals) * 1.02), top = ax.top;
  const X = y => L0 + (y - y0) / Math.max(1, y1 - y0) * iw, Yp = v => T0 + ih - v / top * ih;
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += ax.step) { const yy = Yp(v);
    g += `<line class="grid" x1="${L0}" x2="${W - R0}" y1="${yy}" y2="${yy}"/><text x="${L0 - 6}" y="${yy + 3}" text-anchor="end">${kfmt(v)}</text>`; }
  for (let y = Math.ceil(y0 / 5) * 5; y <= y1; y += 5) g += `<text x="${X(y)}" y="${H - 6}" text-anchor="middle">${y}</text>`;
  g += `<line class="ax" x1="${L0}" x2="${W - R0}" y1="${T0 + ih}" y2="${T0 + ih}"/>`;
  // VIIRS start marker
  if (2012 >= y0 && 2012 <= y1) g += `<line x1="${X(2012)}" x2="${X(2012)}" y1="${T0}" y2="${T0 + ih}" stroke="rgba(216,222,200,.35)" stroke-dasharray="2 3"/>
    <text x="${X(2012) + 4}" y="${T0 + 8}" style="fill:var(--lichen)">${esc(t('viirsStarts'))}</text>`;
  const path = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
  const full = Y.filter(o => !o.partial), last = Y[Y.length - 1];
  const seg = (sel, color, w, dash = '') => {
    const ptsF = full.filter(o => sel(o) != null).map(o => [X(o.y), Yp(sel(o))]);
    let s = `<path d="${path(ptsF)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
    if (last.partial && sel(last) != null && ptsF.length) {
      const pv = full[full.length - 1];
      s += `<path d="M${X(pv.y)} ${Yp(sel(pv))}L${X(last.y)} ${Yp(sel(last))}" fill="none" stroke="${color}" stroke-width="${w}" stroke-dasharray="3 3" opacity=".7"/>`;
    }
    return s;
  };
  if (raw) {
    g += seg(o => o.modis, '#D8DEC8', 1.8);
    g += seg(o => o.viirs, '#E9A23B', 2.2);
  } else {
    const band = Y.map(o => [X(o.y), Yp(o.hi)]).concat(Y.slice().reverse().map(o => [X(o.y), Yp(o.lo)]));
    g += `<path d="${path(band)}Z" fill="rgba(127,176,105,.22)" stroke="none"/>`;
    g += seg(o => o.modis, 'rgba(216,222,200,.35)', 1.2, '2 3');
    g += seg(o => o.h, '#7FB069', 2.4);
  }
  // tooltip targets
  Y.forEach(o => { const v = raw ? `MODIS ${fmt(o.modis)}${o.viirs != null ? ', VIIRS ' + fmt(o.viirs) : ''}` : `${fmt(o.h)} (${fmt(o.lo)}–${fmt(o.hi)})`;
    g += `<rect x="${X(o.y) - iw / (Y.length * 2)}" y="${T0}" width="${iw / Y.length}" height="${ih}" fill="transparent"><title>${o.y}${o.partial ? ' (' + t('partial') + ')' : ''}: ${v}</title></rect>`; });
  if (last.partial) g += `<text x="${X(last.y)}" y="${T0 + ih - 6}" text-anchor="end" style="font-size:9px">${esc(t('partial'))}</text>`;
  const svg = $('chYears'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
  svg.setAttribute('aria-label', `${t('yearsTitle')}, ${y0}–${y1}`);
  $('yearsSub').textContent = raw ? t('yearsSubRaw') : t('yearsSubHarm');
  $('keyYears').innerHTML = raw
    ? `<span><i style="border-color:#D8DEC8"></i>${t('kModis')}</span><span><i style="border-color:#E9A23B"></i>${t('kViirs')}</span>`
    : `<span><i style="border-color:#7FB069"></i>${t('kHarm')}</span><span><i class="band"></i>${t('kBand')}</span><span><i style="border-color:rgba(216,222,200,.5);border-top-style:dashed"></i>${t('kModis')}</span>`;
  $('capYears').textContent = raw ? t('capRaw') : t('capHarm');
  document.querySelectorAll('#rawSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === rawMode));
}
document.querySelectorAll('#rawSeg button').forEach(b => b.onclick = () => { rawMode = b.dataset.v; chartYears(); });

const STOPS = [[0, [36,64,47]], [.4, [122,106,46]], [.7, [233,162,59]], [1, [228,87,46]]];
function ramp(t0) { t0 = Math.max(0, Math.min(1, t0));
  for (let i = 1; i < STOPS.length; i++) if (t0 <= STOPS[i][0]) {
    const [a, ca] = STOPS[i - 1], [b, cb] = STOPS[i], k = (t0 - a) / (b - a);
    return `rgb(${ca.map((c, j) => Math.round(c + (cb[j] - c) * k)).join(',')})`; } return 'rgb(228,87,46)'; }
function chartHeat() {
  const years = [...new Set(CAL.monthly.map(m => +m.ym.slice(0, 4)))].sort((a, b) => a - b);
  const W = 360, L0 = 34, R0 = 4, T0 = 16, rowH = Math.max(7, Math.min(11, 270 / years.length)), H = T0 + rowH * years.length + 6;
  const cw = (W - L0 - R0) / 12, maxV = Math.max(1, ...CAL.monthly.map(m => m.harmonized || 0)), lmax = Math.log1p(maxV);
  const idx = {}; CAL.monthly.forEach(m => idx[m.ym] = m);
  let g = '';
  t('months').forEach((mn, i) => g += `<text x="${L0 + cw * i + cw / 2}" y="10" text-anchor="middle">${esc(mn)}</text>`);
  years.forEach((y, r) => {
    const yy = T0 + r * rowH;
    const lastR = years.length - 1, lab = y % 5 === 0 || r === 0 || (r === lastR && y % 5 > 1);
    if (lab) g += `<text x="${L0 - 5}" y="${yy + rowH - 1.5}" text-anchor="end">${y}</text>`;
    for (let mI = 0; mI < 12; mI++) {
      const m = idx[`${y}-${String(mI + 1).padStart(2, '0')}`]; if (!m) continue;
      const v = m.harmonized || 0, fill = v > 0 ? ramp(Math.log1p(v) / lmax) : 'rgba(216,222,200,.05)';
      g += `<rect x="${(L0 + cw * mI + .5).toFixed(1)}" y="${(yy + .5).toFixed(1)}" width="${(cw - 1).toFixed(1)}" height="${(rowH - 1).toFixed(1)}" rx="1.5" fill="${fill}"><title>${esc(t('calTip', m.ym, fmt(v, 1), t('basis')[m.basis] || m.basis))}</title></rect>`;
    }
  });
  const r2012 = years.indexOf(2012);
  if (r2012 > 0) g += `<line x1="${L0 - 2}" x2="${W - R0}" y1="${T0 + r2012 * rowH}" y2="${T0 + r2012 * rowH}" stroke="rgba(216,222,200,.6)" stroke-dasharray="2 2"/>`;
  const svg = $('chHeat'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
  svg.setAttribute('aria-label', `${t('heatTitle')}, ${years[0]}–${years[years.length - 1]}`);
  $('rampBar').style.background = `linear-gradient(90deg, ${[0, .25, .5, .75, 1].map(ramp).join(',')})`;
}
function chartClim() {
  const C = CAL.climatology || []; if (!C.length) return;
  const W = 360, H = 200, L0 = 34, R0 = 6, T0 = 22, B0 = 22, iw = W - L0 - R0, ih = H - T0 - B0, cw = iw / 12;
  const cur = (CAL.current_year && CAL.current_year.months) || [];
  const ax = niceAxis(Math.max(...C.map(c => c.p90), ...cur.map(c => c.value || 0)) * 1.04), top = ax.top;
  const Yp = v => T0 + ih - v / top * ih, Xc = mI => L0 + cw * mI + cw / 2;
  const doy = s => { const [mm, dd] = s.split('-').map(Number); return (mm - 1) + (dd - 1) / 30.5; };
  let g = '';
  (CAL.critical_windows || []).forEach((w, i) => {
    let a = doy(w.from), b = doy(w.to) + 1 / 30.5; if (b < a) b += 12;
    const x1 = L0 + a * cw, x2 = Math.min(W - R0, L0 + b * cw);
    g += `<rect x="${x1.toFixed(1)}" y="${T0}" width="${Math.max(2, x2 - x1).toFixed(1)}" height="${ih}" fill="rgba(233,162,59,.16)"/>
      <text x="${((x1 + x2) / 2).toFixed(1)}" y="${T0 - 6 - (i % 2) * 0}" text-anchor="middle" style="fill:var(--amber);font-size:9.5px">${esc(tx(w, 'label'))}</text>`;
  });
  for (let v = 0; v <= top + 1e-9; v += ax.step) { const yy = Yp(v);
    g += `<line class="grid" x1="${L0}" x2="${W - R0}" y1="${yy}" y2="${yy}"/><text x="${L0 - 5}" y="${yy + 3}" text-anchor="end">${kfmt(v)}</text>`; }
  C.forEach(c => { const mI = c.month - 1, x = Xc(mI), bw = cw * .5;
    g += `<rect x="${(x - bw / 2).toFixed(1)}" y="${Yp(c.mean).toFixed(1)}" width="${bw.toFixed(1)}" height="${(T0 + ih - Yp(c.mean)).toFixed(1)}" rx="2" fill="rgba(216,222,200,.32)"><title>${esc(t('monthsLong')[mI])}: ${fmt(c.mean, 1)} (${fmt(c.p10, 1)}–${fmt(c.p90, 1)})</title></rect>
      <line x1="${x}" x2="${x}" y1="${Yp(c.p10)}" y2="${Yp(c.p90)}" stroke="#D8DEC8" stroke-width="1.4"/>
      <line x1="${x - 4}" x2="${x + 4}" y1="${Yp(c.p90)}" y2="${Yp(c.p90)}" stroke="#D8DEC8" stroke-width="1.4"/>
      <line x1="${x - 4}" x2="${x + 4}" y1="${Yp(c.p10)}" y2="${Yp(c.p10)}" stroke="#D8DEC8" stroke-width="1.4"/>
      <text x="${x}" y="${H - 7}" text-anchor="middle">${esc(t('months')[mI])}</text>`; });
  g += `<line class="ax" x1="${L0}" x2="${W - R0}" y1="${T0 + ih}" y2="${T0 + ih}"/>`;
  const curPts = cur.filter(c => c.value != null).map(c => [Xc(c.month - 1), Yp(c.value), c]);
  if (curPts.length > 1) g += `<path d="${curPts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('')}" fill="none" stroke="#E4572E" stroke-width="1.4" opacity=".6"/>`;
  curPts.forEach(([x, y, c]) => g += `<circle cx="${x}" cy="${y}" r="${Math.abs(c.z || 0) >= 1.5 ? 5 : 3.5}" fill="#E4572E" stroke="${Math.abs(c.z || 0) >= 1.5 ? '#fff' : 'none'}" stroke-width="1.5"><title>${CAL.current_year.year}, ${esc(t('monthsLong')[c.month - 1])}: ${fmt(c.value, 1)}, z = ${fmt(c.z, 1)}</title></circle>`);
  const svg = $('chClim'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
  svg.setAttribute('aria-label', t('climTitle'));
  const yr = (CAL.current_year && CAL.current_year.year) || YEAR_NOW();
  $('climSub').textContent = t('climSub', yr);
  $('keyClim').innerHTML = `<span><i class="bar"></i>${t('kMean')}</span><span><i style="border-color:#D8DEC8;width:2px;height:10px;border-top:0;border-left:2px solid #D8DEC8"></i>${t('kRange')}</span>`
    + `<span><i class="dot"></i>${esc(t('kNow', yr))}</span>` + ((CAL.critical_windows || []).length ? `<span><i class="win"></i>${t('kWin')}</span>` : '');
}
function renderCheck() {
  const v = CAL.validation || {}, p = CAL.pairs || {};
  $('check').innerHTML = `
    <div><span>${t('vMape')}</span><b>${v.yearly_mape != null ? fmt(v.yearly_mape, 0) + '%' + (v.yearly_naive_mape != null ? ' <small>(' + fmt(v.yearly_naive_mape, 0) + '%)</small>' : '') : (v.mape != null ? fmt(v.mape * (v.mape <= 1.5 ? 100 : 1), 0) + '%' : '—')}</b></div>
    <div><span>${t('vR2')}</span><b>${fmt(v.yearly_r2 ?? v.r2, 2)}</b></div>
    <div><span>${t('vPairs')}</span><b>${p.match_rate != null ? fmt(p.match_rate * (p.match_rate <= 1 ? 100 : 1), 0) + '%' : '—'}</b></div>

}

function renderCalendar() {

  $('calLead').textContent = t('calLead', Math.min(...ys), Math.max(...ys));

function renderAll() {

  renderTele(); renderVerdict(); renderPlaces(); renderLog(); renderAlarm(); renderLegend();

async function poll() {
  try {
    const r = await fetch('/api/state', {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    S = await r.json();
    online = true; $('offline').hidden = true;
    const d = S.now ? new Date(S.now) : new Date();
    $('clock').textContent = d.toLocaleString(t('locale'), {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'});
    renderAll();
    if (!fittedOnce) { fittedOnce = true; if (MODE === 'station' && !(S.mission && S.mission.phase !== 'done')) fitAll(); }
    if (!S.mission || S.mission.phase === 'done' || MODE !== 'station') $('follow').hidden = true;
  } catch {

  }
}
applyStatic();
$('title').textContent = t('connecting');
setMode(new URLSearchParams(location.search).get('tab') === 'calendar' ? 'calendar' : 'station');

addEventListener('resize', () => { if (MODE === 'station' && !(S && S.mission && S.mission.phase !== 'done')) fitAll(); });
